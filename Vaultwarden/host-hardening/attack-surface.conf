# /etc/modprobe.d/attack-surface.conf  (Vault VM + edge VPS, same file)
#
# Kernel modules nothing on these boxes uses, blocked BEFORE the next bug in
# them gets a name. Copy Fail, Dirty Frag, PinTheft and nginx2root's SCTP step
# all lived in code like this: never needed here, but auto-loaded the moment
# any unprivileged process opened the matching socket or mounted the matching
# filesystem. The per-vulnerability files next to this one (disable-algif,
# dirtyfrag, pintheft, disable-sctp) stay as they are.
#
# Checked against lsmod on both boxes 2026-11-19: none of these is loaded,
# except `floppy` on the Vault VM (Proxmox's virtual floppy controller, unused);
# for that one the block applies from the next boot. A name that doesn't exist
# on this kernel is harmless (the line just never matches).
#
# Deliberately NOT blocked (in use): wireguard + udp_tunnel (VPS), nf_tables /
# x_tables / nft_* (UFW, CrowdSec bouncer, podman's netavark), overlay, tun,
# veth, bridge + stp + llc (rootless podman + pasta), btrfs / md / raid* / vfat
# (VPS disks + EFI), ext4, vsock, 8021q, bochs / drm (Proxmox console), the USB
# host drivers (Proxmox's virtual tablet), erofs (podman's composefs can use it).
#
# Something stopped working after a reboot? `sudo journalctl -b | grep -i
# modprobe` and look for one of these names; or move this file out of
# /etc/modprobe.d/ and reboot to rule it out in one go.

# --- rare network protocols ---
install dccp /bin/false
install tipc /bin/false
install atm /bin/false
install kcm /bin/false
install af_key /bin/false
install smc /bin/false
install caif /bin/false
install qrtr /bin/false
install phonet /bin/false
install nfc /bin/false
install bluetooth /bin/false
install ieee802154 /bin/false
install ieee802154_socket /bin/false
install 6lowpan /bin/false
install can /bin/false
install can_raw /bin/false
install can_bcm /bin/false
install can_gw /bin/false
install can_isotp /bin/false
install can_j1939 /bin/false
install ax25 /bin/false
install netrom /bin/false
install rose /bin/false
install x25 /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8022 /bin/false
install llc2 /bin/false
install l2tp_core /bin/false
install l2tp_ppp /bin/false
install l2tp_ip /bin/false
install l2tp_ip6 /bin/false
install l2tp_eth /bin/false
install n_hdlc /bin/false

# --- tunnel devices (a user namespace lets an unprivileged user create these) ---
install ipip /bin/false
install sit /bin/false
install ip_gre /bin/false
install ip6_gre /bin/false
install ip6_tunnel /bin/false
install fou /bin/false
install fou6 /bin/false
install geneve /bin/false
install vxlan /bin/false

# --- filesystems nothing here mounts ---
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install affs /bin/false
install befs /bin/false
install ufs /bin/false
install nilfs2 /bin/false
install gfs2 /bin/false
install ocfs2 /bin/false
install jfs /bin/false
install minix /bin/false
install qnx4 /bin/false
install qnx6 /bin/false
install sysv /bin/false
install romfs /bin/false
install hpfs /bin/false
install omfs /bin/false
install f2fs /bin/false
install squashfs /bin/false

# --- hardware a VM doesn't have ---
install usb-storage /bin/false
install uas /bin/false
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install thunderbolt /bin/false
install floppy /bin/false
