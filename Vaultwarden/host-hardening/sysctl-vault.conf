# /etc/sysctl.d/90-attack-surface.conf on the Vault VM
#
# io_uring off for everyone (2 = disabled, 1 = only for io_uring_group). It has
# been behind a long run of kernel local-root bugs, and PinTheft (CVE-2026-43494)
# used io_uring fixed buffers to turn its bug into a write. Nothing here needs
# it: nginx, Vaultwarden, CrowdSec and podman don't use it, and Node's libuv
# (crowdsec-web-ui) checks for it and falls back to its thread pool.
#
# Unprivileged user namespaces stay ON here (kernel.unprivileged_userns_clone
# = 1, the Debian default): rootless podman is built on them. The VPS turns
# them off, see vps/sysctl-hardening.conf.
#
# Apply without a reboot: sudo sysctl --system
kernel.io_uring_disabled = 2
