services:
  bunkerweb:
    container_name: bunkerweb
    image: docker.io/bunkerity/bunkerweb-all-in-one:latest
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      # Bind to privileged ports (<1024); kept defensively. BunkerWeb's
      # default HTTP_PORT/HTTPS_PORT are 8080/8443 (>1024),
      # and the host port mapping below targets those internal ports,
      # so the cap isn't strictly needed today. Stays granted in case a
      # future image bump changes the internal listen ports.
      - NET_BIND_SERVICE
      # Change file ownership: scheduler writes state files owned by the nginx user.
      - CHOWN
      # Bypass file-permission checks: read configs / write logs across uid/gid boundaries.
      - DAC_OVERRIDE
      # Change process GID: master forks workers and drops them to the unprivileged group.
      - SETGID
      # Change process UID: same as above, drops workers from root to the nginx user.
      - SETUID
    # Not read_only: BunkerWeb writes into /etc/nginx (regenerated config),
    # /var/cache/nginx, /var/log/nginx, and /data. The image isn't designed
    # for a read-only rootfs. Other hardening (cap_drop ALL, no-new-privileges,
    # explicit cap_add, resource limits) still applies.
    tmpfs:
      - /tmp
      - /var/run
    deploy:
      resources:
        limits:
          # 512M (was 384M) for headroom now that the bundled Web UI is
          # exposed. The UI shares this container's budget with nginx +
          # scheduler + redis; idle the whole lot sits ~240M, but active UI
          # use can spike and an OOM here would take nginx (the proxy) down
          # with it. +128M is cheap insurance on a 4G+ VM.
          memory: 512M
          cpus: "0.75"
    ports:
      # 80/tcp:  HTTP. Required for ACME HTTP-01 renewals (Let's Encrypt's
      #          validator only tries port 80 for this challenge). BunkerWeb
      #          serves the challenge response here and 301-redirects
      #          everything else to HTTPS.
      # 443/tcp: HTTPS (HTTP/1.1 + HTTP/2). The actual vault traffic.
      # 443/udp: HTTP/3 (QUIC). Optional; clients fall back to HTTP/2 on
      #          TCP if this is closed. Drop if you want a narrower surface.
      #
      # Rootless-podman caveat: the host-side bind to 80/443 requires the
      # poduser to be allowed to open privileged ports. Lower the kernel's
      # `net.ipv4.ip_unprivileged_port_start` to 80 once on the VM. Full
      # commands (live + persist-across-reboots) in the README under
      # § Infrastructure Setup → Host Tuning → "Unprivileged port
      # binding for rootless Podman".
      # (CAP_NET_BIND_SERVICE on the container above only governs the
      # container's *internal* listener; it doesn't grant the host-side
      # bind that podman performs as poduser.)
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
      # Admin Web UI (HTTPS via UI_SSL_* below). Restrict 7000 at your
      # firewall to the admin device; on a single-homed VM, binding all
      # interfaces is the same as binding the one NIC.
      - "7000:7000/tcp"
      # CrowdSec Web UI (HTTPS). Not a BunkerWeb service: a plain nginx
      # server block in bunkerweb/custom-configs/http/crowdsec-web-ui.conf
      # terminates TLS with the same /ui-tls cert as 7000 and proxies to the
      # crowdsec-web-ui container. Same exposure rules as 7000: OPNsense lets
      # only the admin device in, and it stays out of the VPS_TUNNEL rules.
      - "7001:7001/tcp"
    environment:
      TZ: "${TZ}"
      # Space-separated: the vault hostname AND the bare apex domain (the
      # apex must answer on HTTPS to stay on the HSTS preload list).
      # BunkerWeb turns each name into its own service with its own
      # server block and its own Let's Encrypt cert (two certs, renewed
      # separately; the scheduler logs "2 service(s)"). Every setting
      # below is global, so both services get the same controls. The apex
      # only ever gets a tiny JSON status, never Vaultwarden (see
      # REVERSE_PROXY_INCLUDES below and
      # bunkerweb/custom-configs/http/apex.conf).
      SERVER_NAME: "${SERVER_NAME}"
      # Refuse unknown-vhost connections at both layers: STRICT_SNI aborts
      # the TLS handshake on unknown/missing SNI (no cert presented),
      # DISABLE_DEFAULT_SERVER denies it later at the HTTP layer.
      DISABLE_DEFAULT_SERVER: "yes"
      DISABLE_DEFAULT_SERVER_STRICT_SNI: "yes"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://vaultwarden:8080"
      # Vaultwarden uses websockets for live sync (/notifications/hub).
      REVERSE_PROXY_WS: "yes"
      # Included inside the generated `location /`: for apex-domain
      # requests, swaps the proxy backend from Vaultwarden to a loopback
      # JSON server (bunkerweb/custom-configs/http/apex.conf).
      REVERSE_PROXY_INCLUDES: "/etc/bunkerweb/apex-dispatch.conf"

      # PROXY protocol from an upstream sender. KEEP ONLY IF you're running
      # this flavor behind an edge VPS that does TCP passthrough WITH
      # `proxy_protocol on;` set on its nginx stream (see
      # vps/nginx/streams.d/passthrough.conf for the canonical setup the
      # `public-dns01` flavor uses; the same VPS topology can in principle
      # front this `public-http01` flavor too, just with HTTP-01 ACME on
      # the BunkerWeb side instead of DNS-01).
      #
      # REMOVE these env vars (or set USE_PROXY_PROTOCOL: "no") if you're
      # running this flavor with TRUE direct exposure (home connection has
      # a routable public IPv4, ports 80/443 forwarded straight to the VM,
      # no upstream proxy). With no PROXY-protocol-sending upstream, the
      # listener would expect a header that never arrives and reject every
      # incoming connection as malformed HTTP.
      #
      # The four-env-var pattern matches docker-compose.public-dns01.yml;
      # see that file's commentary for the per-var explanation. Same trust
      # list for REAL_IP_FROM: both podman bridges (security 10.89.1.0/24
      # + backend 10.89.2.0/24) plus the WG tunnel 10.10.10.0/30. Both
      # bridges are listed because pasta (rootless podman 5.x default)
      # picks one for inbound port-forwarded SNAT and the choice can
      # shift between podman versions. Adjust the WG CIDR if your tunnel
      # uses a different subnet.
      USE_PROXY_PROTOCOL: "yes"
      USE_REAL_IP: "yes"
      REAL_IP_HEADER: "proxy_protocol"
      REAL_IP_FROM: "10.89.1.0/24 10.89.2.0/24 10.10.10.0/30"

      # DNS resolvers: podman's aardvark-dns listens on each bridge's gateway.
      # BunkerWeb defaults to Docker's embedded resolver (127.0.0.11) which
      # does NOT exist on podman; without this, nginx cannot resolve the
      # `vaultwarden` / `crowdsec` container names. Subnets are pinned below
      # so these gateway IPs are contractual.
      DNS_RESOLVERS: "10.89.1.1 10.89.2.1"

      # Let's Encrypt (HTTP-01 challenge)
      AUTO_LETS_ENCRYPT: "yes"
      EMAIL_LETS_ENCRYPT: "${EMAIL_LETS_ENCRYPT}"
      LETS_ENCRYPT_CHALLENGE: "http"

      # TLS hardening: TLS 1.2 + 1.3. "modern" is BunkerWeb's strongest
      # cipher preset (AEAD-only, no CBC), so keeping TLS 1.2 enabled
      # broadens client reach without pulling in weak cipher suites.
      SSL_PROTOCOLS: "TLSv1.2 TLSv1.3"
      SSL_CIPHERS_LEVEL: "modern"

      # HTTP->HTTPS redirect, pinned so a future BunkerWeb default change
      # can't silently drop it. AUTO_REDIRECT redirects when HTTPS is
      # detected, REDIRECT_HTTP_TO_HTTPS forces it. The HTTPS listener has
      # no on/off setting: it comes up on HTTPS_PORT (default 8443) as soon
      # as a cert source is on (AUTO_LETS_ENCRYPT above). A LISTEN_HTTPS
      # line used to sit here, but BunkerWeb has no such setting; the
      # scheduler logged "variable name LISTEN_HTTPS doesn't exist" and
      # ignored it (2026-10-15, 1.6.16).
      AUTO_REDIRECT_HTTP_TO_HTTPS: "yes"
      REDIRECT_HTTP_TO_HTTPS: "yes"

      # Security headers are owned entirely by
      # custom-configs/server-http/headers-passthrough-apply.conf (with an
      # http-scope map in custom-configs/http/headers-upstream-passthrough.conf
      # for the XFO/CSP upstream passthrough). BW's env-var headers plugin is
      # bypassed to insulate us from version-to-version drift in its emission
      # rules. REMOVE_HEADERS stays here because it's a different mechanism
      # (suppression of response headers, not injection).
      REMOVE_HEADERS: "Server Via X-Powered-By X-AspNet-Version X-AspNetMvc-Version"

      # Don't replace upstream 4xx/5xx responses with BunkerWeb's HTML error
      # pages. Vaultwarden's API needs its own JSON error bodies to pass
      # through untouched (clients parse them).
      INTERCEPTED_ERROR_CODES: ""

      # Vaultwarden API uses PUT (cipher edit + soft-delete to trash via
      # /api/ciphers/<id>/delete), PATCH, DELETE, and OPTIONS (CORS preflight
      # from web vault + browser extensions). BunkerWeb's default
      # ALLOWED_METHODS is GET|POST|HEAD, which 405s every vault edit at the
      # nginx layer before ModSec or Vaultwarden ever sees the request.
      # Pipe-separated (regex alternation, not commas/spaces).
      ALLOWED_METHODS: "GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS"

      # Country blacklist
      BLACKLIST_COUNTRY: "CN RU KP IR SY CU VE BY"

      # User-agent blacklist (built-in list auto-fetched + custom additions)
      # BunkerWeb already fetches the nginx-ultimate-bad-bot-blocker list by default
      # which includes sqlmap, nikto, nmap, zgrab, havij, dirbuster, etc.
      # We add extra patterns not in the default list:
      # CensysInspect is Censys's own scanner UA (about.censys.io), on top of
      # the rDNS/ASN/IP blocks below, belt-and-suspenders per the usual policy.
      BLACKLIST_USER_AGENT: "python-requests python-urllib python-httpx httpx wget go-http-client libwww-perl masscan CensysInspect"

      # rDNS blacklist: deny IPs whose PTR matches these patterns.
      # Three buckets, all worth blocking on a password manager:
      #   (a) Continuous-scan / banner-grab platforms (shodan, censys,
      #       binaryedge, rapid7, leakix, onyphe, stretchoid). These will
      #       fingerprint exposed services and surface them in public
      #       search; primary motivation for this list.
      #   (b) Search engine crawlers (google, googlebot, yandex, bing,
      #       baidu, yahoo). They typically don't crawl API-only / unlinked
      #       endpoints, but if the URL ever leaks into a public page or
      #       Google Doc, the crawler tries it. No reason a search engine
      #       should ever index a password manager.
      #   (c) Link / preview fetchers (linkedin, twitter, discord). If the
      #       vault URL is pasted in a chat, these fetch it to render a
      #       preview card. Mild op-sec win to deny that.
      # BunkerWeb caches the rDNS lookup so per-connection overhead is
      # negligible; entries that never match just sit unused.
      BLACKLIST_RDNS: ".shodan.io .censys.io .censys-scanner.com .binaryedge.ninja .rapid7.com .leakix.net .onyphe.io .stretchoid.com .google.com .googlebot.com .yandex.ru .yandex.net .yandex.com .search.msn.com .baidu.com .baidu.jp .crawl.yahoo.net .fwd.linkedin.com .twitter.com .twttr.com .discord.com"

      # Whitelist OFF. BunkerWeb ships USE_WHITELIST=yes with a default
      # WHITELIST_RDNS of almost exactly the crawler list above (google,
      # googlebot, yandex, msn, baidu, yahoo, linkedin, twitter, discord),
      # and a whitelisted client skips the security checks. It only trusts
      # an rDNS match after a forward lookup confirms it; the Vault VM's
      # Pi-hole default-deny blocks that lookup, so today it whitelists
      # nobody, but that's the DNS deny carrying the policy by accident. And
      # every blocked confirmation fired a Wazuh 100252 DNS alert (first one
      # from Googlebot on the bare apex, 2026-09-28). We whitelist nothing
      # on purpose, so off is the honest setting: no lookups, no alerts,
      # crawlers still 403 via BLACKLIST_RDNS.
      USE_WHITELIST: "no"

      # Rate limiting (tuned for ~5 users). BunkerWeb 1.6.x dropped the
      # standalone LIMIT_REQ_BURST setting and the limit plugin has no burst:
      # the 6th request inside one second gets a 429.
      # LIMIT_REQ_URL is a PCRE regex; "/" is the fallback, used only when no
      # other pattern matches the URI, so the global 5r/s still covers every
      # other route (login, ciphers, admin).
      # /api/config override added 2026-10-20: the Bitwarden iOS/iPadOS app
      # (2026.9.x) fires up to ~23 parallel GET /api/config in the same
      # millisecond on unlock/foreground (app + autofill extension). The 10-11
      # to 10-20 BunkerWeb report showed 91 x 429, all on that route, all
      # family devices (LU + BR), ~2 bursts/day. /api/config is unauthenticated,
      # read-only server settings, so a higher rate there costs nothing;
      # brute-force protection stays with LOGIN_RATELIMIT_* + CrowdSec.
      # /icons/ override added the same day: scrolling the vault list on iOS
      # loads one /icons/<domain>/icon.png per visible entry in parallel and
      # hit the 5r/s fallback. With ICON_SERVICE=bitwarden Vaultwarden only
      # answers a redirect (no outbound fetch, DISABLE_ICON_DOWNLOAD=true), so
      # these are unauthenticated and cheap. The two patterns never overlap,
      # so the unordered rule lookup in the limit plugin can't pick the wrong one.
      USE_LIMIT_REQ: "yes"
      LIMIT_REQ_URL: "/"
      LIMIT_REQ_RATE: "5r/s"
      LIMIT_REQ_URL_1: "^/api/config$"
      LIMIT_REQ_RATE_1: "30r/s"
      LIMIT_REQ_URL_2: "^/icons/"
      LIMIT_REQ_RATE_2: "50r/s"

      # DNSBL (check IPs against known spam/abuse lists)
      USE_DNSBL: "yes"
      DNSBL_LIST: "bl.blocklist.de dnsbl.dronebl.org"

      # BunkerNet off. Its nginx workers ping api.bunkerweb.io on every
      # start/reload straight from Lua (resty.http, no proxy support), so
      # the call skips Squid and the firewall blocks it. CrowdSec's far
      # larger blocklist already covers BunkerNet's ~100 shared IPs.
      USE_BUNKERNET: "no"

      # badbehavior: naive per-IP non-200 counter (400/401/403/404/405/429/444,
      # threshold 10 → 24h ban). Triggers false-positive cascades on Vaultwarden
      # since admin /diagnostics + normal login flow emits bursts of 401/403/404
      # that look identical to probing. CrowdSec already gives us scenario-based
      # bans with proper tuning. Leave this off.
      USE_BAD_BEHAVIOR: "no"

      # robots.txt and security.txt are served via custom Nginx configs (see custom-configs/)

      # WAF
      # 1.6.9 dropped MODSECURITY_SEC_AUDIT_LOG (path is fixed internally).
      # MODSECURITY_CRS_PARANOIA_LEVEL is NOT a BunkerWeb setting and never was
      # at any version (verified against bunkerweb's git history); an earlier
      # note here wrongly called it "dropped in 1.6.9". Paranoia is set through
      # CRS's own SecAction + setvar mechanism, see
      # custom-configs/modsec-crs/paranoia.conf.
      USE_MODSECURITY: "yes"
      USE_MODSECURITY_CRS: "yes"
      # Flipped to "On" 2026-06-16 after nearly two months in DetectionOnly
      # tuning exclusions. modsec_audit.log only retains 7 days (logrotate), and
      # that window showed only scanners crossing the blocking threshold; the FP
      # exclusions in custom-configs/modsec-crs/ were verified against live
      # /api/ciphers + /admin/config traffic (both 200, sub-threshold). Roll back
      # to "DetectionOnly" + recreate if a legit-traffic FP ever surfaces, add
      # the matching exclusion, then re-flip.
      MODSECURITY_SEC_RULE_ENGINE: "On"
      MODSECURITY_SEC_AUDIT_ENGINE: "RelevantOnly"
      # NOTE: audit log format (JSON vs Native) is NOT exposed as a BW env
      # var; the equivalent libmodsecurity directive `SecAuditLogFormat`
      # is set via a custom config at
      # bunkerweb/custom-configs/modsec/audit-log-format.conf instead.

      # CrowdSec bouncer
      USE_CROWDSEC: "yes"
      CROWDSEC_API: "http://crowdsec:8080"
      CROWDSEC_API_KEY: "${CROWDSEC_BOUNCER_KEY}"
      # live, not stream: each client IP is looked up in LAPI on demand
      # and the verdict cached CROWDSEC_CACHE_EXPIRATION seconds. In stream mode the
      # bouncer never left startup=true, so it re-downloaded the full
      # decision list (~115k IPs with the CAPI + subscribed blocklists,
      # ~17 MB, ~9s of LAPI work at 0.5 CPU) every poll: ~70 MB/min
      # crowdsec -> bunkerweb, constant CPU, and memory spikes in the 192M
      # crowdsec container. For a low-traffic vault, a per-IP lookup is
      # cheaper anyway. The VPS nftables bouncer stays on stream (it pulls
      # deltas correctly).
      CROWDSEC_MODE: "live"
      # 60s, not the 1s default: a client pays the lookup at most once a
      # minute instead of on nearly every request. A new ban reaches
      # BunkerWeb within 60s; the VPS nftables bouncer drops it within ~10s.
      CROWDSEC_CACHE_EXPIRATION: "60"

      # --- Admin Web UI ---------------------------------------------------
      # Bundled in the all-in-one image and enabled via SERVICE_UI below,
      # listening on 7000 (published above). Served over TLS directly on its
      # own listener, no reverse-proxy vhost needed. Point UI_SSL_CERTFILE/
      # KEYFILE at an internal-CA-signed leaf (SANs for the VM hostname + LAN
      # IP) mounted ro at /ui-tls (see volumes); the UI does NOT generate one
      # for you. Restrict 7000 at your firewall to the admin device.
      # SERVICE_UI pinned: it's the AIO default, but pinning keeps a future
      # image default from silently dropping the UI.
      SERVICE_UI: "yes"
      UI_SSL_ENABLED: "yes"
      UI_SSL_CERTFILE: "/ui-tls/cert.pem"
      UI_SSL_KEYFILE: "/ui-tls/key.pem"
      # Admin account seeded from .env (reproducible across restarts/rebuilds,
      # skips the setup wizard). UI_ADMIN_* are namespaced in .env so they
      # don't collide with Vaultwarden's ADMIN_TOKEN; BunkerWeb reads the keys
      # ADMIN_USERNAME / ADMIN_PASSWORD. Password policy: 8+ chars with
      # lower+upper+digit+special. OVERRIDE_ADMIN_CREDS: "yes" forces a reset.
      ADMIN_USERNAME: "${UI_ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${UI_ADMIN_PASSWORD}"
    volumes:
      - bw-data:/data
      - /srv/bw-logs:/var/log/bunkerweb
      - ./bunkerweb/security.txt:/etc/bunkerweb/security.txt:ro
      - ./bunkerweb/robots.txt:/etc/bunkerweb/robots.txt:ro
      # Apex dispatch, see REVERSE_PROXY_INCLUDES. Mounted on its own (not
      # via custom-configs/) because it must only land inside `location /`.
      - ./bunkerweb/apex-dispatch.conf:/etc/bunkerweb/apex-dispatch.conf:ro
      # Web UI TLS material (internal-CA leaf + key, see UI_SSL_* above). Host
      # dir lives OUTSIDE the git tree (private key) and its files are chown'd
      # to the container's mapped uid so the rootless container can read them.
      - /srv/bw-ui-tls:/ui-tls:ro
      # Custom configs mounted at /data/configs (BW's native ingest path), not
      # /etc/bunkerweb/configs. The scheduler scans /data/configs/<type>/,
      # writes into its DB, then renders to /etc/bunkerweb/configs (internal,
      # writable). Bind-mounting directly over /etc/bunkerweb/configs:ro made
      # the scheduler's rm-then-rewrite cycle fail with EROFS and return HTTP
      # 500 on /custom_configs every boot, even though the configs worked.
      #
      # Mount is rw (not ro): BW's entrypoint does `mkdir -p /data/configs/<type>`
      # for http/server-http/modsec/modsec-crs/stream on boot. Our git tree
      # ships the first four; `stream/` is missing, so :ro makes the mkdir
      # fail with EROFS and the scheduler FATALs in a restart loop. BW only
      # creates sibling dirs; it never modifies our tracked config files.
      - ./bunkerweb/custom-configs:/data/configs
    # Soft dependency: proxy starts even if CrowdSec is unhealthy/down
    depends_on:
      crowdsec:
        condition: service_started
    restart: unless-stopped
    networks: [security, backend]

  crowdsec:
    container_name: crowdsec
    image: docker.io/crowdsecurity/crowdsec:latest
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      # Bypass file-permission checks: crowdsec reads log files owned by other uids (bunkerweb, vaultwarden).
      - DAC_OVERRIDE
      # Change process GID: crowdsec drops privilege to its own group after startup.
      - SETGID
      # Change process UID: same as above, drops from root to the crowdsec user.
      - SETUID
    # NOTE: no `read_only: true` here. CrowdSec's hub installer writes symlinks
    # into /etc/crowdsec/{scenarios,parsers,postoverflows}/... when pulling
    # collections, and chtimes the data dir on boot. The `crowdsec-config` and
    # `crowdsec-db` named volumes already isolate writable state from the host.
    tmpfs:
      - /tmp
      - /var/run
    deploy:
      resources:
        limits:
          # 256M (was 192M): headroom for the CrowdSec Web UI, which logs
          # in as a watcher, heartbeats every 30s, syncs alerts every minute
          # and reads the Prometheus metrics.
          memory: 256M
          # 1.0, not 0.5: at 0.5 the CFS quota throttled crowdsec in ~1/3 of
          # periods (log-parsing bursts on every proxied request), which made
          # BunkerWeb's live LAPI lookups take 0.2-1s and hit its 1s timeout.
          cpus: "1.0"
    ports:
      # Expose CrowdSec's LAPI on the host so an external bouncer (e.g. the
      # VPS-side crowdsec-firewall-bouncer-nftables, see ideas.md #10) can
      # poll for decisions. Binds to 0.0.0.0:8080 by omitting the IP prefix;
      # the upstream firewall is the load-bearing source-IP gate.
      # If you're running this flavor with TRUE direct exposure (no upstream
      # VPS bouncer), this port mapping is pointless and you can comment it
      # out. BunkerWeb's bouncer plugin reaches CrowdSec via the internal
      # Podman `security` network as `http://crowdsec:8080` regardless of
      # this host mapping.
      - "8080:8080/tcp"
    environment:
      TZ: "${TZ}"
      COLLECTIONS: "bunkerity/bunkerweb"
      # We deliberately do NOT add the upstream crowdsecurity/modsecurity
      # COLLECTION. Its scenario bans on a single CRITICAL-severity (sev 2)
      # rule match, which is far too aggressive (one borderline request can
      # cross sev-2 without being a real attack).
      #
      # Instead we ship our own scenario vaultwarden/modsec-high-anomaly (in
      # crowdsec/scenarios/), which bans on the AGGREGATE CRS inbound anomaly
      # score >= 10. That floor is data-driven: with the engine On, the
      # would-be-blocks audit proved legit traffic never reaches score 5 (the
      # BW-level exclusions strip the FP rules), so 10 (a couple of rule
      # matches) keeps a 2x margin over legit while catching lower-scoring
      # attacks a higher gate would miss. Less trigger-happy than the upstream
      # single-rule scenario, which fires on one borderline match.
      #
      # So: KEEP the PARSERS line below even now that the engine is On, the
      # custom scenario needs the parser's rule_id / log_type / source_ip
      # fields, and do NOT add the collection.
      # See acquis.d/bunkerweb.yaml for the parser-routing reasoning.
      PARSERS: "crowdsecurity/modsecurity"
      # BOUNCER_KEY_<NAME> auto-registers a bouncer named <NAME> with the
      # given API key on container start. Idempotent across container
      # recreates and volume rebuilds. Cleaner than manually running
      # `cscli bouncers add` and tracking the generated key.
      BOUNCER_KEY_PROXY: "${CROWDSEC_BOUNCER_KEY}"
      # Pre-registers the VPS-side firewall bouncer (see ideas.md #10).
      # Only meaningful if this flavor is fronted by the VPS topology;
      # remove if running with TRUE direct exposure (no VPS bouncer
      # to register a key for).
      BOUNCER_KEY_VPS_FW_BOUNCER: "${CROWDSEC_VPS_BOUNCER_KEY}"
      ENROLL_KEY: "${CROWDSEC_ENROLL_KEY}"
      ENROLL_INSTANCE_NAME: "vaultwarden-prod"
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      # acquis.d: per-file mounts so the hub can still write sibling files
      # (e.g. auto-installed acquisitions) into /etc/crowdsec/acquis.d/.
      # Overlaying the whole dir :ro would block that.
      - ./crowdsec/acquis.d/bunkerweb.yaml:/etc/crowdsec/acquis.d/bunkerweb.yaml:ro
      - ./crowdsec/acquis.d/vaultwarden.yaml:/etc/crowdsec/acquis.d/vaultwarden.yaml:ro
      - /srv/bw-logs:/var/log/bunkerweb:ro
      - /srv/vw-logs:/var/log/vaultwarden:ro
      # Custom parsers + scenarios + whitelists each mount into a
      # `vaultwarden/` subdir of their respective stage so the hub keeps
      # ownership of the parent dirs for its own symlinks.
      - ./crowdsec/parsers:/etc/crowdsec/parsers/s01-parse/vaultwarden:ro
      - ./crowdsec/scenarios:/etc/crowdsec/scenarios/vaultwarden:ro
      - ./crowdsec/whitelists:/etc/crowdsec/parsers/s02-enrich/vaultwarden:ro
      # Merged over the volume's config.yaml at startup: trusted_ips for the
      # CrowdSec Web UI (alert deletion) + Prometheus metrics. Per-file,
      # like acquis.d, so config.yaml itself stays the image's own.
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [security]

  crowdsec-web-ui:
    # Dashboard for CrowdSec: alerts, decisions (manual bans / unbans),
    # metrics. https://github.com/TheDuffman85/crowdsec-web-ui
    # Reached at https://vaultwarden-home:7001 through BunkerWeb's nginx
    # (bunkerweb/custom-configs/http/crowdsec-web-ui.conf); publishes no
    # host port itself. Login: local admin + TOTP, created on first visit.
    container_name: crowdsec-web-ui
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    # The image's node user (1000), set here so the entrypoint skips its
    # root-only `chown -R /app/data` + gosu step and no capability is needed.
    # The named volume is initialised from the image's /app/data, which is
    # already node-owned.
    user: "1000:1000"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      TZ: "${TZ}"
      # Login to LAPI as a watcher machine, registered once with
      # `cscli machines add crowdsec-web-ui --password ... -f /dev/null`
      # (lives in the crowdsec-db volume; README § CrowdSec Web UI).
      CONFIG_INSTANCE_ID: "vault"
      CONFIG_INSTANCE_NAME: "Vault VM"
      CONFIG_INSTANCE_LAPI_URL: "http://crowdsec:8080"
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: "crowdsec-web-ui"
      CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: "${CROWDSEC_WEBUI_PASSWORD}"
      # Metrics page. 6060 is only reachable on the security network
      # (crowdsec/config.yaml.local), never host-published.
      CONFIG_INSTANCE_METRICS_URL: "http://crowdsec:6060/metrics"
      # 30 days of history. CrowdSec flushes its own alerts after 7 days by
      # default (db_config.flush.max_age), so the Web UI's own copy is the
      # only place days 8-30 are kept.
      CONFIG_CROWDSEC_SYNC_LOOKBACK: "30d"
      # No alert filter set: the default feed leaves out the community
      # blocklist (CAPI) and subscribed lists, ~115k IPs that would bury the
      # local bans and load the 256M crowdsec container on every sync.
      CONFIG_AUTH_ENABLED: "true"
      # No egress needed: the update check would call api.github.com
      # (images are updated by the nightly docker-update.sh), no
      # notification destinations are configured, and the GeoNames data is
      # in the image. Anything it still tried would be refused by Squid or
      # OPNsense and show up in #squid or #firewall.
      CONFIG_UPDATES_ENABLED: "false"
      CONFIG_UI_TIME_ZONE: "${TZ}"
      CONFIG_UI_TIME_FORMAT: "24h"
      CONFIG_UI_DATE_FORMAT: "dd/mm/yyyy"
    volumes:
      # SQLite cache + admin account + settings. Not backed up: losing it
      # means re-creating the admin and re-importing the last 7 days.
      - crowdsec-web-ui-data:/app/data
    # The image's HEALTHCHECK, restated: podman drops it from OCI images.
    # CMD-SHELL with the JS quoted for sh, not a ["CMD", "node", "-e", ...]
    # list: podman-compose joins that list into one unquoted string for
    # /bin/sh, which then dies on `fetch(` ("Syntax error: ( unexpected").
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      crowdsec:
        condition: service_started
    restart: unless-stopped
    networks:
      security:
        # Fixed, because two things point at it by address:
        # - crowdsec/config.yaml.local trusts exactly this IP (alert
        #   deletion needs api.server.trusted_ips, not just a login)
        # - the 7001 server block proxies to this IP, not to the name: nginx
        #   resolves a name once at startup and fails to start if the
        #   container is down, which would take the vault down with it.
        # High in the /24 so podman's sequential allocation for the other
        # containers never lands on it.
        ipv4_address: 10.89.1.50

  vaultwarden:
    container_name: vaultwarden
    image: docker.io/vaultwarden/server:latest
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
    environment:
      TZ: "${TZ}"
      DOMAIN: "${DOMAIN}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"

      # Rocket HTTP: bind all interfaces so BunkerWeb can reach it over the backend network
      ROCKET_PORT: "8080"
      ROCKET_ADDRESS: "0.0.0.0"

      # Access policy
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      SENDS_ALLOWED: "false"
      # Block "forgot my master password hint" flow. The hint itself leaks
      # information about master-password patterns to anyone who knows the email.
      PASSWORD_HINTS_ALLOWED: "false"
      # First login from a new device fingerprint sends an *informational*
      # email to the account address (not a code-entry verification, that
      # would be _enable_email_2fa, opt-in per-user). With this set to true,
      # the login *fails* if SMTP delivery fails. Useful as an alarm + hard
      # gate against silent unknown-device logins, at the cost of being
      # unable to log in from new devices during an SMTP outage. Existing
      # devices keep working regardless.
      REQUIRE_DEVICE_EMAIL: "true"
      # Disable "emergency access" contacts feature. Not used here and the
      # delayed-takeover flow is an attack path if a contact account is ever
      # compromised or configured by mistake.
      EMERGENCY_ACCESS_ALLOWED: "false"

      # Real client IP: direct exposure, BunkerWeb sets X-Forwarded-For upstream
      CLIENT_IP_HEADER: "X-Forwarded-For"

      # Logging (consumed by CrowdSec via the vaultwarden-logs parser)
      EXTENDED_LOGGING: "true"
      LOG_FILE: "/logs/vaultwarden.log"
      LOG_LEVEL: "error"
      LOG_TIMESTAMP_FORMAT: "%Y-%m-%d %H:%M:%S.%3f%z"

      # Vaultwarden-side rate limits, complement CrowdSec's longer-window scenarios.
      # Three independent layers (most-specific first):
      # - ADMIN_RATELIMIT_*  : /admin/* token bruteforce (10 reqs / 5 min, strict)
      # - LOGIN_RATELIMIT_*  : master-password attempts (3 reqs / 60s, strict;
      #                        VW default is 10/60s, tightened so an attacker
      #                        burns through CrowdSec's bf scenario faster)
      # - RATELIMIT_*        : general API (100 reqs / 60s, generous, prevents
      #                        accidental DoS without throttling normal use)
      ADMIN_RATELIMIT_MAX_BURST: "10"
      ADMIN_RATELIMIT_SECONDS: "300"
      LOGIN_RATELIMIT_MAX_BURST: "3"
      LOGIN_RATELIMIT_SECONDS: "60"
      RATELIMIT_MAX_BURST: "100"
      RATELIMIT_SECONDS: "60"

      # Icons: use Bitwarden's central icon service instead of fetching directly
      # from each saved login's website. Keeps outbound allowlist to a single
      # known host (icons.bitwarden.net). Clients fetch icons from Bitwarden's
      # CDN directly. VW never proxies icon traffic.
      ICON_SERVICE: "bitwarden"
      # Belt-and-suspenders: kill VW's server-side icon fetcher entirely. Guards
      # against (a) misbehaving clients hitting /icons/<host>/icon.png, (b) SSRF
      # attempts where /icons/<attacker-host>/... would otherwise trigger
      # arbitrary outbound HTTP, (c) accidental future flip back to ICON_SERVICE
      # internal.
      DISABLE_ICON_DOWNLOAD: "true"
      # Disable the negative icon cache. Default 3-day NEGTTL means any failed
      # icon fetch (transient network blip, DNS hiccup) gets remembered as
      # "no icon for this domain" for 72h, hiding a perfectly valid icon long
      # after the cause is fixed. Positive TTL stays at default (30d); favicons
      # rarely change so 30-day staleness is fine.
      ICON_CACHE_NEGTTL: "0"

      # Mailjet SMTP
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURITY: "${SMTP_SECURITY}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT}"
    expose:
      - "8080"
    volumes:
      - /srv/vw-data:/data
      - /srv/vw-logs:/logs
    healthcheck:
      # Must use curl, NOT wget. The vaultwarden/server image does not
      # ship wget, so a wget probe fails every interval with
      # "/bin/sh: 1: wget: not found". Each failed probe also surfaces
      # as a process exit-1 in the container logs, which lights up SIEM
      # noise (Wazuh flagged 994 consecutive exit-1 events before this
      # was caught).
      test: ["CMD", "curl", "-sf", "http://localhost:8080/alive"]
      interval: 30s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

volumes:
  bw-data:
    name: bw-data
  crowdsec-db:
    name: crowdsec-db
  crowdsec-config:
    name: crowdsec-config
  crowdsec-web-ui-data:
    name: crowdsec-web-ui-data

networks:
  # Subnets are pinned so the aardvark-dns gateway IPs referenced in
  # DNS_RESOLVERS above stay contractual across `podman-compose down`/`up`
  # cycles. If you change a subnet here, update DNS_RESOLVERS to match and
  # tear the networks down first; podman refuses to mutate IPAM on an
  # existing network.
  #
  # Note: same network names + subnets as docker-compose.cf-tunnel.yml and
  # docker-compose.public-dns01.yml so a switch between flavors reuses the
  # existing networks cleanly. Only one of the three compose files should
  # be running at a time.
  security:  # proxy <-> crowdsec
    name: security
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.1.0/24
  backend:   # proxy <-> vaultwarden
    name: backend
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.2.0/24
