# Drop-in: order a Wazuh unit after wazuh-indexer, so the indexer starts
# first and stops last.
#
# wazuh-home runs native systemd services, not containers, so a shutdown
# or reboot already stops them cleanly. What it doesn't do is stop them
# in order: the stock units don't order themselves against each other,
# so the indexer can go down while the manager, filebeat and the
# dashboard are still writing to it. This drop-in is the whole fix, no
# script needed. It applies to the Proxmox Shutdown button, a manual
# `sudo reboot` and main.sh's reboot alike, and it's the same order
# UPGRADE.md uses by hand (indexer up first, down last).
#
# Install (as root, from this folder), into the three units that talk
# to the indexer:
#   for u in wazuh-manager filebeat wazuh-dashboard; do
#       install -D -m 0644 after-indexer.conf \
#           /etc/systemd/system/$u.service.d/after-indexer.conf
#   done
#   systemctl daemon-reload
#
# Verify (each line includes wazuh-indexer.service):
#   systemctl show -p After wazuh-manager filebeat wazuh-dashboard
#
# Ordering only, no Requires=: an indexer that fails to start doesn't
# stop the others from starting. Drop-ins under /etc/systemd/system
# aren't package files, so upgrading the held Wazuh packages leaves
# them alone.

[Unit]
After=wazuh-indexer.service
