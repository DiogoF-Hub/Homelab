# wazuh-home: receive OPNsense's firewall log (filterlog) over syslog and
# keep ONLY the lines that involve the Vault VM. Everything else OPNsense
# sends is dropped here, before Wazuh ever sees it: every syslog line
# wazuh-remoted receives lands in the archive whatever the rules say, so
# the filter has to sit in front of Wazuh.
#
# Install:  sudo apt install rsyslog
#           sudo mkdir -p /var/log/opnsense
#           sudo nano /etc/rsyslog.d/10-opnsense.conf      (paste this file)
#           sudo rsyslogd -N1 && sudo systemctl restart rsyslog
#           sudo ss -ulpn | grep ':514'                   (rsyslogd)
#
# Port 514 must not also be claimed by wazuh-remoted: no <remote>
# syslog block in the manager's ossec.conf.
#
# OPNsense side: System > Settings > Logging > Remote, one destination:
# UDP(4), Applications = filter (filterlog) only, Levels / Facilities
# empty (= all), Hostname 192.168.173.10, Port 514, RFC5424 unchecked;
# and Firewall > Settings > Advanced > "Log packets matched from the
# default block rules" ticked, so the implicit deny is logged too.
#
# ',192.168.50.3,' with the commas matches the Vault VM as filterlog's
# source or destination field, and never e.g. 192.168.50.30. The file is
# written in the classic syslog format, so Wazuh's built-in pf decoder
# reads it exactly as it reads syslog straight from OPNsense.
# Rotation: logrotate-opnsense (same folder).

module(load="imudp")
input(type="imudp" address="192.168.173.10" port="514" ruleset="opnsense")

# Bound to the input above: OPNsense's lines only go through this ruleset,
# never into the default /var/log/syslog rules.
ruleset(name="opnsense") {
    if $fromhost-ip == "192.168.173.1" and $programname == "filterlog"
       and $msg contains ",192.168.50.3," then {
        action(type="omfile" file="/var/log/opnsense/vault-filter.log"
               template="RSYSLOG_TraditionalFileFormat")
    }
}
