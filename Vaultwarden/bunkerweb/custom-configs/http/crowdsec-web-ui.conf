# CrowdSec Web UI on https://vaultwarden-home:7001 (LAN admin only).
#
# The Web UI (crowdsec-web-ui container) only speaks plain HTTP on :3000 and
# publishes no host port. This server block is the HTTPS front for it, in
# BunkerWeb's nginx so no extra proxy container is needed. Published by
# compose as 7001:7001 next to the 7000 admin UI, with the same exposure:
# OPNsense lets only the admin device in, and 7001 is in no VPS_TUNNEL rule.
#
# Why its own port, not a BunkerWeb service on 443: 443 only takes PROXY-
# protocol connections from the edge VPS (USE_PROXY_PROTOCOL), so a vhost
# there would be reachable from the internet and never from the LAN.
#
# This is a plain nginx server, not a BunkerWeb service: none of BW's checks
# (CrowdSec, ModSecurity, limit_req, server-http/ headers) run here, same as
# the 7000 UI. That's fine for a LAN-only admin page behind its own login.
#
# Careful: this file is loaded by the same nginx that serves the vault. A
# syntax error here stops nginx from (re)loading, so the vault goes down too.
# After any change, check the vault still answers.

# WebSocket upgrade passthrough (Connection: upgrade only when the client
# asked for it). Prefixed so it can't clash with a BW-side map.
map $http_upgrade $cswebui_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 7001 ssl;

    # Same internal-CA leaf as the 7000 UI (SANs: vaultwarden-home,
    # vaultwarden-home.localdomain, 192.168.50.3). Renewing /srv/bw-ui-tls
    # needs a bunkerweb container restart for this port to pick it up.
    ssl_certificate     /ui-tls/cert.pem;
    ssl_certificate_key /ui-tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Own log files (host: /srv/bw-logs/, rotated by the existing
    # /srv/bw-logs/*.log logrotate rule). Kept out of access.log / error.log
    # on purpose: CrowdSec parses those two for attacks on the vault, and
    # the UI's constant API polling has no business there.
    # The client address logged is the podman bridge, not the admin device:
    # rootless port forwarding SNATs, and there's no PROXY header on 7001.
    access_log /var/log/bunkerweb/crowdsec-ui-access.log;
    error_log  /var/log/bunkerweb/crowdsec-ui-error.log;

    # The Web UI caps API bodies at 1 MiB itself.
    client_max_body_size 1m;

    location / {
        # By IP, not by name: nginx resolves a name once at startup and
        # refuses to start if it can't, so a stopped crowdsec-web-ui would
        # take the whole nginx (and the vault) down. With the fixed IP
        # (compose ipv4_address) a stopped UI is just a 502 here.
        proxy_pass http://10.89.1.50:3000;
        proxy_http_version 1.1;

        # The Web UI uses these for its mutation-origin checks and secure
        # session cookies: Host without the port, X-Forwarded-Host with it.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $cswebui_connection_upgrade;
    }
}
