# Bare apex domain: a tiny JSON status page so HSTS preload stays valid.
#
# hstspreload.org requires the APEX itself to redirect http -> https and
# to answer on HTTPS with `Strict-Transport-Security: max-age>=31536000;
# includeSubDomains; preload`. Nothing else is hosted there.
#
# How it works (the real domain appears nowhere in the repo, only in
# .env's SERVER_NAME, which lists the vault hostname AND the apex):
#
#   1. Both names share BunkerWeb's one server block + cert, so every
#      control (HTTP->HTTPS redirect, blacklists, DNSBL, CrowdSec,
#      ModSecurity, limit_req, headers) runs for the apex exactly as for
#      the vault.
#   2. The map below picks the proxy BACKEND by host shape: the apex is
#      the only served name with exactly one dot. Only names in
#      SERVER_NAME reach that server block (DISABLE_DEFAULT_SERVER), so
#      one dot can only mean the apex. The vault must stay on a subdomain.
#   3. bunkerweb/apex-dispatch.conf (included inside the reverse-proxy
#      `location /` via REVERSE_PROXY_INCLUDES) swaps the backend to the
#      loopback server below for apex requests. Vaultwarden never sees them.
#
# Why swap the backend instead of `rewrite`-ing to a separate location:
# `rewrite ... last` marks the request internal, and BunkerWeb's
# access_by_lua skips internal requests entirely ("skipped access phase
# because request is internal"): no HTTPS redirect, no blacklists, no
# CrowdSec. Observed 2026-09-27: http://<apex>/ served 200 instead of 301,
# and a python-requests UA got 200 on the apex vs 403 on the vault.
# Changing only the backend keeps it an ordinary proxied request.
map $host $bw_apex_backend {
    default                "";
    "~^[^.]+\.[^.]+$"      http://127.0.0.1:18080;
}

# The apex "website". Loopback-only inside the container (not published
# by compose, not reachable from the podman bridges), so the only way in
# is through the front server above, after all its checks have run.
# `return` is fine HERE: this is the backend, not the front server, and
# access control already happened there (contrast ipcheck.conf).
server {
    listen 127.0.0.1:18080;

    # The front server already logged, inspected and scored this request.
    # Logging / inspecting it again would attribute every apex hit to
    # 127.0.0.1 in access.log and modsec_audit.log (and so CrowdSec).
    access_log off;
    modsecurity off;

    default_type application/json;

    # Passed through to the client by the front server's XFO/CSP upstream
    # passthrough (http/headers-upstream-passthrough.conf); HSTS and the
    # other globals are added there by headers-passthrough-apply.conf.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = / {
        return 200 '{"status": "ok"}\n';
    }

    location / {
        return 404 '{"error": "not found"}\n';
    }
}
