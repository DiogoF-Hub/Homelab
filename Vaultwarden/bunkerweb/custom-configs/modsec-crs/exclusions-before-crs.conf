# Rule of thumb: client→server (request-phase, rule IDs 9xx < 950) exclusions go here.
# Exclusions BEFORE CRS, applied before rules run (step 6 in BunkerWeb order)
# Use this to prevent rules from firing on known-safe requests.
# This is the preferred place for most exclusions.
#
# After editing, restart the proxy: `sudo su - poduser`, then `podman-compose restart bunkerweb`
# ================================================================

# Allow HTTP methods required by Vaultwarden API (PUT, PATCH, DELETE)
# Without this, rule 911100 blocks vault edit/delete operations
SecRule REQUEST_URI "@rx ^/(identity|api|accounts|notifications|icons|connect|admin)(/|$)" \
  "id:100014,phase:1,pass,nolog,setvar:tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE"

# ================================================================
# Verified false positives (observed in /srv/bw-logs/modsec_audit.log)
# EVERY rule below this header is ACTIVE. The engine has been On (blocking)
# since 2026-06-16, so a PL1 rule here is holding back a live 403; the PL2
# ones are audit-noise-only until blocking_paranoia_level goes to 2.
# House rule: nothing active ever goes below the "Community-reported"
# divider. That drift is how the README exclusions table fell 6 entries
# behind reality.
# ================================================================

# --- 942120 (PL2): "SQL Operator Detected (==)" on encrypted blobs ---
# Encrypted Vaultwarden fields (cipher data, folder names, etc.) are base64
# with "==" padding, which the rule treats as a SQL operator. Fires on every
# POST/PUT carrying encrypted blobs. Scoped to /api/ciphers + /api/folders
# + /api/accounts/password (master-password change POSTs the re-encrypted
# key blob, same == padding); extend if other /api/* endpoints surface.
SecRule REQUEST_URI "@rx ^/api/(ciphers|folders|accounts/password)" \
  "id:100050,phase:1,pass,nolog,ctl:ruleRemoveById=942120"

# --- 942430 (PL2): "Restricted SQL char anomaly count > 12" on special-char-heavy payloads ---
# Three endpoints carry payloads with many special chars (".", "-", "_",
# "=" from base64url, JWT segment dots, or a whole URL) that trip the
# special-character counter:
#   - /notifications/hub?access_token=<JWT>  (Bitwarden live-sync WebSocket)
#   - /identity/connect/token                (OAuth-style login + refresh)
#   - /icons/change-password-uri?uri=<url>   (URL value passed as a param)
SecRule REQUEST_URI "@rx ^/(notifications/hub|identity/connect/token|icons/change-password-uri)" \
  "id:100051,phase:1,pass,nolog,ctl:ruleRemoveById=942430"

# --- 932240 (PL2): "Unix Command Injection evasion" on admin auth ---
# The argon2id-hashed admin_token has format
# $argon2id$v=19$m=...$<base64>$<base64>. The digit/quote/digit pattern in
# the hash trips this RCE evasion rule. Only fires on POST /admin/config;
# other 932xxx RCE rules still apply on the same endpoint.
SecRule REQUEST_URI "@beginsWith /admin/config" \
  "id:100052,phase:1,pass,nolog,ctl:ruleRemoveById=932240"

# --- 932200 (PL2): "RCE Bypass Technique" on admin save ---
# Same root cause as 932240: the argon2id-hashed admin_token value
# trips the rule's whitespace-class operator over the hash content.
# Confirmed in audit log: matched ARGS:json.admin_token with the
# $argon2id$... value. Same /admin/config scope as 932240.
SecRule REQUEST_URI "@beginsWith /admin/config" \
  "id:100055,phase:1,pass,nolog,ctl:ruleRemoveById=932200"

# --- 920230 (PL2): "Multiple URL Encoding Detected" on log_timestamp_format ---
# Vaultwarden's admin panel exposes a log line format string at
# ARGS:json.log_timestamp_format. Default is "%Y-%m-%d %H:%M:%S.%3f%z";
# the strftime tokens (%Y, %m, %d, %H, %M, %S, %3f, %z) match CRS's
# %[0-9a-fA-F]{2} multi-encoding heuristic, even though the field is
# a literal strftime template, not URL-encoded data. Same /admin/config
# scope as the 932xxx rules above.
# Header used to say PL1; upstream tags 920230 paranoia-level/2. Matters because
# with blocking_paranoia_level=1 it contributes 0 today, so this exclusion has
# never actually been exercised under blocking. Re-verify after the PL2 bump.
SecRule REQUEST_URI "@beginsWith /admin/config" \
  "id:100056,phase:1,pass,nolog,ctl:ruleRemoveById=920230"

# --- 942131 (PL2): "SQL Operator Detected" on /admin login token ---
# The admin login form submits ARGS:token=<plaintext>; complex passwords
# with "$", "%", "^", etc. trip the SQL operator detector. The token is
# only compared against the argon2id hash configured in ADMIN_TOKEN, never
# used in a SQL query, so disabling this rule on the bare /admin endpoint
# is structurally safe. Other 942xxx rules still apply.
SecRule REQUEST_URI "@rx ^/admin/?$" \
  "id:100053,phase:1,pass,nolog,ctl:ruleRemoveById=942131"

# --- 931130 + 931100 (PL2): RFI rules on the icon lookup endpoint ---
# /icons/change-password-uri?uri=<url> takes a URL as a lookup KEY, the
# server doesn't actually fetch it. 931130 (off-domain reference) and 931100
# (RFI URL pattern) both fire because there's a URL in a param, but no remote
# inclusion happens. Other 931xxx rules still apply on other paths.
# (What makes this safe is that the endpoint has NO route in Vaultwarden at
# all, it 404s. Not DISABLE_ICON_DOWNLOAD, as this comment used to claim: that
# flag is only read inside get_icon(), reachable via icon_internal, so it's
# inert entirely while ICON_SERVICE=bitwarden.)
SecRule REQUEST_URI "@beginsWith /icons/change-password-uri" \
  "id:100054,phase:1,pass,nolog,ctl:ruleRemoveById=931130,ctl:ruleRemoveById=931100"

# --- 930130 (PL1, CRITICAL): "Restricted File Access Attempt" on the icon route ---
# Vaultwarden's only /icons route is GET /icons/<host>/icon.png, so a saved
# login's domain lands verbatim in the URL path. 930130 runs restricted-files.data
# against REQUEST_FILENAME via @pmFromFile, which is an unanchored substring match
# with no path-boundary awareness, so any domain containing one of those entries
# matches. Two collision classes:
#   - dot-directory entries whose label is a real TLD: .tools/ .wine/ .aws/
#     .azure/ .java/  (.git/ .ssh/ .npm/ .docker/ .svn/ .config/ .cache/ are in
#     the file too, but aren't delegated TLDs, so they only bite on internal DNS)
#   - entries with NO trailing slash, the wider hazard, they match mid-label:
#     api.envoy.com hits ".env", www.cvs.com hits ".cvs", my.passport.com ".pass"
# PL1 + CRITICAL is +5 on its own and tx.inbound_anomaly_score_threshold is 5, so
# one hit 403s via 949110 with no second rule needed. Confirmed 2026-07-22 on a
# .tools icon lookup from a legit client; nothing else contributed to the score.
#
# Gated on REQUEST_FILENAME, the same and ONLY variable 930130 reads, so gate and
# rule can't desync over decoding, and it carries no query string so the $ anchor
# is safe. First label can't start with a dot, so /icons/.git/icon.png and
# /icons/.env/icon.png still score normally (and Vaultwarden's get_valid_host
# rejects empty labels anyway, those 404 regardless). "/" and "%" are outside the
# class and the regex is fully anchored, so traversal and double-encoded probes
# don't match the exclusion either. 930100 / 930110 (path traversal) untouched.
#
# Unlike every other exclusion in this file the target rule is phase:1, not
# phase:2. Fine: this file loads before the CRS rules, so the ctl lands first.
#
# 930140 is the same shape on the same variable and phase (ai-critical-artifacts.data,
# PL1, CRITICAL) and collides the same way, ".crush" matches www.crush.com. Newer
# list, so it may not exist in the CRS your BW image ships; ruleRemoveById against
# a missing ID is a silent no-op, so covering it here is free either way.
SecRule REQUEST_FILENAME "@rx ^/icons/[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*/icon\.png$" \
  "id:100057,phase:1,pass,nolog,ctl:ruleRemoveById=930130,ctl:ruleRemoveById=930140"

# --- 920230 (PL2): "Multiple URL Encoding Detected" on the icon lookup ---
# /icons/change-password-uri?uri=<url> carries a saved login's full URL. When the
# stored URL already contains a percent escape, the arg arrives double-encoded
# (%253A) and 920230's leftover-% heuristic fires. Confirmed 2026-07-27 from a
# legit client. The endpoint has no route in Vaultwarden at all so it 404s
# regardless, but ModSec scores the request before Vaultwarden ever sees it.
# Inert today (920230 is PL2, blocking_paranoia_level is 1, so it adds 0). This
# is here so the planned blocking PL1 -> PL2 bump doesn't turn it into a 403.
# Separate ID from 100056 above, which also removes 920230 but on /admin/config
# for a different root cause; keeping them apart keeps both independently
# documented and independently revertible.
#
# Target-scoped instead of a whole-rule removal: ARGS is 920230's only target and
# "uri" is the only param the client sends, so this kills the FP while leaving
# 920230 armed on every other arg, including request bodies (100014 puts /icons
# in tx.allowed_methods with PUT/PATCH/DELETE, so a body-bearing request to this
# path is reachable). Cost of being surgical: if the param name is ever wrong the
# exclusion is a silent no-op. Since it can't prove itself while it scores 0,
# re-check modsec_audit.log for 920230 on this path right after the PL2 bump.
SecRule REQUEST_URI "@beginsWith /icons/change-password-uri" \
  "id:100058,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920230;ARGS:uri"

# --- 942200 (PL2): "MySQL comment-/space-obfuscated injection" on credentials ---
# Vaultwarden's credential surface POSTs opaque base64 and JWT-shaped values:
# /identity/connect/* (token, authorize), /identity/accounts/prelogin,
# /api/accounts/*. Those trip the SQLi detector even though Vaultwarden is
# Rust + Diesel with parameterized queries, so the value never reaches a SQL
# string. Path regex deliberately lists the real routes; an earlier draft used
# `(identity|api|connect)(/|$)`, which both covered a non-existent /connect/*
# and was far too broad for the rest of the API.
#
# OBSERVED, not speculative: uncommented in commit 7b00312 (2026-05-17) after an
# audit-log review caught it firing on a master-password-change + re-login wave.
#
# EFFECT TODAY: audit-only. 942200 is PL2 and blocking_paranoia_level is 1, so
# it contributes 0. It becomes load-bearing at the PL2 bump: 942200 is CRITICAL
# (+5) against a threshold of 5, so losing this exclusion then would 403 every
# POST /identity/connect/token, i.e. lock you out of the vault entirely.
#
# Sat below the "Community-reported / uncomment as needed" divider from
# 2026-05-17 to 2026-07-31, wedged against the commented 942100 stub with no
# blank line between them. Zero runtime effect, but one careless block-comment
# over that region would have silently disarmed it with no error and no symptom
# until the PL2 bump. Moved here to match reality.
#
# TRAILING MATCH is (/|\?|$), not a bare "/". Vaultwarden has DELETE /api/accounts
# (accounts.rs:1247) on the bare path with no trailing segment, carrying the same
# masterPasswordHash body as the covered POST /api/accounts/delete
# (accounts.rs:1242). A bare "/" matched the second and missed the first: split
# coverage on identical payloads. The \? alternative is required because
# REQUEST_URI carries the query string, so a plain $ would fail on
# /api/accounts?x=1.
#
# WHOLESALE ruleRemoveById is DELIBERATE, not an oversight. 942200's targets are
# REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent|
# REQUEST_HEADERS:Referer|ARGS_NAMES|ARGS|XML:/*|XML://@*, so the tighter
# ctl:ruleRemoveTargetById form used on 100058 would be preferable IF we knew
# which target actually matched. We don't: the 2026-05-17 review recorded the
# rule ID but not the matched variable, and guessing wrong gives a silent no-op
# that stays invisible until the PL2 bump turns it into a 403. Evidence that
# would change this: a modsec_audit.log entry for 942200 on these paths showing
# the matched variable name (logdata MATCHED_VAR_NAME / details.matchedVar).
# Until then, broad is the safe direction to be wrong in.
SecRule REQUEST_URI "@rx ^/(identity/connect|identity/accounts|api/accounts)(/|\?|$)" \
  "id:100031,phase:1,pass,nolog,ctl:ruleRemoveById=942200"

# --- 930120 (PL1, CRITICAL): "OS File Access Attempt" on refresh_token JWTs ---
# Confirmed via BunkerWeb Reports UI on 2026-09-14: matched ARGS:refresh_token,
# anomaly_score 5, which alone crosses tx.inbound_anomaly_score_threshold=5, so
# it 403s via 949110 with no second rule needed. Same root cause as the already-
# excluded 930130/930140 on /icons/ above: @pmFromFile does an unanchored
# substring scan of os-files.data (/etc/passwd, win.ini, id_rsa, etc.) against
# the value. Vaultwarden's refresh_token grant sends a long base64url JWT with
# an embedded base64 device_token claim, and over that much base64 text it's
# just a matter of odds before some substring collides with an entry in that
# list. Deterministic per token value, not transient noise: every silent
# background refresh with an unlucky token keeps 403ing until the client is
# reissued a new one, which is also what kept re-tripping CrowdSec's
# http-generic-403-bf scenario and re-banning the same IP day after day.
# Target-scoped rather than a full ruleRemoveById so 930120 stays armed on
# every other ARG at this endpoint (client_id, scope, username, password, etc.).
SecRule REQUEST_URI "@rx ^/identity/connect/token$" \
  "id:100065,phase:1,pass,nolog,ctl:ruleRemoveTargetById=930120;ARGS:refresh_token"

