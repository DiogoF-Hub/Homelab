# CRS paranoia tuning
#
# Paranoia is set through CRS's own mechanism: a SecAction with setvar against
# the tx.*_paranoia_level vars, delivered as a modsec-crs custom config. That is
# the documented approach, not a workaround.
#
# CORRECTION (2026-07-31): this header used to say the
# MODSECURITY_CRS_PARANOIA_LEVEL env var "was dropped in 1.6.9". That was a
# wrong inference, most likely from a BunkerWeb scheduler "Ignoring variable"
# warning, which reads identically for a removed setting and for one that never
# existed. It never existed. Against a full clone of bunkerity/bunkerweb,
# `git log -S "MODSECURITY_CRS_PARANOIA_LEVEL"` returns no commits, and
# `git log -S "PARANOIA"` returns only vendored CRS, libinjection and nginx
# bumps, never a setting definition. BunkerWeb has never exposed a paranoia env
# var at any version, so there was never anything to migrate away from.
# Noted rather than deleted because the wrong claim is already in git history.
#
# WHY THE OVERRIDE WORKS (the old note here had the mechanism wrong): it's
# purely LOAD ORDER. ModSecurity v3 evaluates rules within a phase in the order
# they were loaded, there is no override-by-ID semantics anywhere in it. BW
# includes this file after crs-setup.conf and before the CRS rules, so these
# setvars land ahead of REQUEST-901-INITIALIZATION.conf, whose 901120 / 901125
# only apply defaults when the var is still unset (`SecRule &TX:<var> "@eq 0"`).
# It does not interact with crs-setup's 900000 at all, that SecAction ships
# commented out and never runs.
#
# ON THE ID: 900110 is CRS's own ID for the anomaly-score thresholds, so this
# squats on a reserved ID. Deliberate and verified safe, not assumed:
# libmodsecurity's duplicate-ID check only inspects RuleWithOperator (SecRule),
# and SecAction builds a RuleUnconditional, so duplicate SecAction IDs are
# accepted silently in both directions. BW's shipped crs-setup-v4.conf has
# 900110 commented anyway (900990 is the only live rule in it). Setting an ID
# here does NOT touch tx.inbound_anomaly_score_threshold, which stays at the
# CRS default of 5.
# The one real trap: SecRuleRemoveById DOES reach a SecAction. If anyone ever
# writes `SecRuleRemoveById 900110` meaning "drop CRS's threshold rule", it
# would silently kill THIS rule instead. detection_paranoia_level would fall
# back to blocking's value (1), every PL2 rule would stop being evaluated, and
# the audit log would go quiet in a way that reads as success. Don't.
#
# Two dials:
#   tx.detection_paranoia_level: level at which a rule FIRES at all.
#                                 Higher = more rules evaluated + logged.
#   tx.blocking_paranoia_level:  level at which a fired rule contributes
#                                 to the anomaly score (→ eventual block).
#                                 Must be <= detection level.
#
# Pattern: detection=2, blocking=1. Level-2 rules fire and show up in
# modsec_audit.log (so you can tune exclusions) but DON'T count toward
# blocking until you raise blocking_paranoia_level to 2 as well.
SecAction "id:900110,phase:1,nolog,pass,\
  setvar:tx.blocking_paranoia_level=1,\
  setvar:tx.detection_paranoia_level=2"
