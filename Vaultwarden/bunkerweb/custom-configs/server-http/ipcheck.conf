# Tiny debug endpoint that returns the caller's real client IP as JSON.
# Bookmark in a browser to quickly verify the PROXY-protocol chain
# (VPS -> WG -> bunkerweb realip) is producing a sane $remote_addr.
# If REAL_IP_FROM ever stops covering the right bridge (e.g. pasta's
# SNAT pick shifts under a future podman update), this surfaces it
# immediately: the response shows an RFC1918 internal address instead
# of the caller's public IP.
#
# The body is emitted from `content_by_lua_block`, NOT `return 200`.
# This is load-bearing; do not "simplify" it back.
#
# nginx runs a request through ordered phases:
#   REWRITE -> PREACCESS -> ACCESS -> ... -> CONTENT
# `return` belongs to ngx_http_rewrite_module and fires in REWRITE,
# which finalizes the request on the spot and skips every later phase.
# BunkerWeb's entire blocking stack lives in ACCESS (access_by_lua:
# country / UA / rDNS blacklists, CrowdSec bouncer, ModSecurity, DNSBL,
# ALLOWED_METHODS) and rate limiting lives in PREACCESS (limit_req), so
# a `return`-served location answers 200 to clients every other route
# denies. Observed 2026-08-09: a blacklisted-country client (NG) got 403
# on /robots.txt (served by `alias`, a CONTENT-phase handler) and 200 on
# /__ipcheck in the same session.
#
# content_by_lua_block IS a CONTENT-phase handler, so the request now
# traverses PREACCESS + ACCESS first and inherits every control. A
# geo-blocked or CrowdSec-banned client gets BunkerWeb's 403 here like
# anywhere else. Same fix applied to the /security.txt redirect in
# security-txt-lang.conf. Routes served by `alias` / `proxy_pass` were
# never affected, they are content-phase already.
#
# Unauthenticated, but the body is only the caller's own IP, no info
# they don't already have about themselves. Body kept minimal (just
# $remote_addr, no client-controllable fields like User-Agent) so it
# can't be tricked into emitting broken JSON. Logging stays ON so
# CrowdSec can still flag scanners probing the path.
location = /__ipcheck {
    default_type application/json;

    # XFO + CSP: server-scope more_set_headers in
    # headers-passthrough-apply.conf maps these from $upstream_http_*
    # (see http/headers-upstream-passthrough.conf), which are empty
    # here because this location generates its own body and has no
    # upstream (content_by_lua_block, not proxy_pass).
    # An empty more_set_headers CLEARS the header, so without these
    # nested overrides /__ipcheck would ship with neither. Same trick
    # as the /robots.txt + /security.txt blocks in security-txt-lang.conf.
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; frame-ancestors 'none'";

    # BW's headers plugin emits these on proxied paths but not on
    # locally-generated ones (observed: present on /, missing here
    # pre-fix).
    # Add them locally to match the baseline.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Per-client response (the caller's own IP). No cache anywhere
    # must ever serve one client's response to another.
    add_header Cache-Control "no-store" always;

    # Content-Type comes from `default_type` above (the URI has no
    # extension, so nginx's types hash never matches and the fallback
    # applies). ngx.say appends the trailing newline the old
    # `return 200 '...\n'` form emitted.
    content_by_lua_block {
        ngx.say('{"ip": "', ngx.var.remote_addr, '"}')
    }
}
