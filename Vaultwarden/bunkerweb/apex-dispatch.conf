# Included INSIDE BunkerWeb's generated reverse-proxy `location / {}`
# via REVERSE_PROXY_INCLUDES (see compose). Deliberately NOT under
# custom-configs/: everything in custom-configs/server-http/ is included
# at server level, where this must not run.
#
# For the bare apex, swap the proxy backend from Vaultwarden to the
# loopback JSON server defined in custom-configs/http/apex.conf. Full
# write-up (and why this is NOT a `rewrite`) is in that file.
#
# $backend0 is the variable BunkerWeb's reverse-proxy template sets right
# before `proxy_pass $backend0;` (index 0 = the unsuffixed
# REVERSE_PROXY_HOST). This include is rendered after that `set`, and
# rewrite-module directives run in order, so ours wins for the apex. If a
# BunkerWeb upgrade ever renames the variable, the apex would fall
# through to Vaultwarden: the post-deploy curl on the apex catches it.
if ($bw_apex_backend) {
    set $backend0 $bw_apex_backend;
}
