# /etc/sysctl.d/90-attack-surface.conf on the edge VPS
#
# io_uring off for everyone (2 = disabled). Long run of kernel local-root bugs,
# and PinTheft (CVE-2026-43494) used it. Nothing on the VPS needs it.
#
# Unprivileged user namespaces off (Debian's own switch, default 1). Most
# container-escape and local-root exploits start by creating one, to get
# "root" inside it and reach code (tunnels, netfilter, filesystems) a normal
# user can't. The VPS runs no containers; systemd sandboxing is unaffected
# (it creates namespaces as root, which this doesn't restrict). Never set this
# on the Vault VM: rootless podman needs it.
#
# Apply without a reboot: sudo sysctl --system
kernel.io_uring_disabled = 2
kernel.unprivileged_userns_clone = 0
